<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020">
  <meta name="description" content="ExamLegacy — premium digital education platform: secure PDF store, private library, in-app viewer and AI study tutor.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ExamLegacy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ExamLegacy — Learn · Practice · Master</title>

  <!-- Icons -->
  <link rel="icon" href="/assets/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Design system -->
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <!-- Boot splash — removed by app.js once the app is ready -->
  <div id="splash" role="status" aria-label="Loading ExamLegacy">
    <div class="splash-inner">
      <img class="splash-logo" src="/assets/img/logo.svg" alt="" width="200" height="200">
      <div class="splash-sub">SANJAYXLEGACY</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <!-- Firebase (compat SDK for no-build vanilla JS). Public web config only. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- MathJax v3 — renders STEM equations in AI answers ($…$, $$…$$) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'kbd', 'samp', 'var'] },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>

  <!-- App -->
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/viewer.js"></script>
  <script src="/assets/js/app.js"></script>
  <!-- Safety net: never leave the splash up if boot fails -->
  <script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('gone'); }, 12000);</script>
</body>
</html>
