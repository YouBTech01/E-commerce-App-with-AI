<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ExamLegacy">
  <defs>
    <linearGradient id="ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="markg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset=".55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="docg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#132352"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="234" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#ring)" stroke-width="14" filter="url(#glow)" opacity=".95"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".30"/>

  <!-- Geometric E -->
  <path d="M118 140 L300 140 L316 192 L170 192 L170 216 L272 216 L286 264 L170 264 L170 290 L310 290 L326 344 L118 344 Z"
        fill="url(#markg)"/>
  <path d="M118 140 L300 140 L316 192 L170 192 L170 216 L272 216 L286 264 L170 264 L170 290 L310 290 L326 344 L118 344 Z"
        fill="none" stroke="#0ea5e9" stroke-width="3" opacity=".55"/>

  <!-- Document + growth chart -->
  <path d="M316 158 h72 l34 34 v132 a16 16 0 0 1 -16 16 h-90 a16 16 0 0 1 -16 -16 v-150 a16 16 0 0 1 16 -16 z"
        fill="url(#docg)" stroke="url(#ring)" stroke-width="4"/>
  <path d="M388 158 l34 34 h-24 a10 10 0 0 1 -10 -10 z" fill="#0ea5e9" opacity=".85"/>
  <rect x="332" y="268" width="17" height="46" rx="5" fill="url(#growth)"/>
  <rect x="357" y="246" width="17" height="68" rx="5" fill="url(#growth)"/>
  <rect x="382" y="222" width="17" height="92" rx="5" fill="url(#growth)"/>
  <polyline points="330,262 356,236 378,244 404,198" fill="none" stroke="#67e8f9" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="414,180 413,208 391,194" fill="#67e8f9"/>

  <!-- Wordmark -->
  <text x="256" y="414" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', 'Arial Black', Arial, Helvetica, sans-serif"
        font-size="50" font-weight="800" letter-spacing="-1">
    <tspan fill="#f8fafc">Exam</tspan><tspan fill="url(#growth)">Legacy</tspan>
  </text>
</svg>
